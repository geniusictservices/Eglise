<title>Manuel de Waumini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : barre du haut, sommaire à gauche (tiroir sur téléphone), colonne de lecture.
   Couleurs de Waumini : indigo du pagne wax, ocre, terre cuite, fond sable. */
:root {
  --ground: #FFFAF3;
  --paper: #FFFFFF;
  --ink: #22255A;
  --text: #2A2C47;
  --muted: #6A6358;
  --line: #EDE3D3;
  --indigo: #2C2F6B;
  --indigo-soft: #EEEFF8;
  --ochre: #E39B2C;
  --ochre-deep: #9A6410;
  --ochre-soft: #FEF3E0;
  --terra: #B5532F;
  --on-indigo: #FFFFFF;
  --shadow: 0 1px 2px rgb(34 37 90 / .06), 0 8px 24px rgb(34 37 90 / .06);
  --font: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --bar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15162B; --paper: #1D1F38; --ink: #E9E9F7; --text: #D6D6E6; --muted: #A3A0B5; --line: #2E3052;
    --indigo: #8F93E0; --indigo-soft: #262850; --ochre: #F0B04E; --ochre-deep: #F3C16F; --ochre-soft: #33291A;
    --terra: #E58B67; --on-indigo: #15162B; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #15162B; --paper: #1D1F38; --ink: #E9E9F7; --text: #D6D6E6; --muted: #A3A0B5; --line: #2E3052;
  --indigo: #8F93E0; --indigo-soft: #262850; --ochre: #F0B04E; --ochre-deep: #F3C16F; --ochre-soft: #33291A;
  --terra: #E58B67; --on-indigo: #15162B; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--text); font: 400 16px/1.65 var(--font); }

/* Barre du haut, sur un motif de pagne wax discret */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar); display: flex; align-items: center; gap: 12px; padding-inline: 16px;
  background-color: #2C2F6B; color: #fff;
  background-image:
    radial-gradient(circle at 12px 12px, rgb(227 155 44 / .55) 0 3px, transparent 3.5px),
    radial-gradient(circle at 36px 36px, rgb(201 98 60 / .5) 0 3px, transparent 3.5px),
    radial-gradient(circle at 36px 12px, transparent 0 5px, rgb(255 255 255 / .12) 5px 6px, transparent 6.5px);
  background-size: 48px 48px;
}
.bar .logo { display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; text-decoration: none; }
.bar .mark { flex: none; width: 32px; height: 32px; border-radius: 10px; background: #E39B2C; display: grid; place-items: center; }
.bar .name { font-weight: 600; font-size: 17px; white-space: nowrap; }
.bar .name span { font-weight: 400; opacity: .8; }
.bar .spacer { flex: 1; }
.btn-toc {
  display: none; align-items: center; gap: 8px; border: 0; border-radius: 12px; padding: 8px 12px;
  background: rgb(255 255 255 / .16); color: #fff; font: 600 14px var(--font); cursor: pointer;
}
.btn-toc:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: start; max-width: 1240px; margin-inline: auto; }

/* Sommaire */
.toc {
  position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); height: calc(100dvh - var(--bar) - env(safe-area-inset-top, 0px));
  overflow-y: auto; padding: 20px 16px 40px; border-right: 1px solid var(--line);
}
.search { position: relative; margin-bottom: 16px; }
.search input {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 38px; background: var(--paper);
  color: var(--text); font: 400 15px var(--font);
}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.toc h2 { margin: 18px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ochre-deep); }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a {
  display: flex; gap: 10px; padding: 7px 8px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14.5px; line-height: 1.35;
}
.toc a .n { flex: none; width: 22px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc a:hover { background: var(--indigo-soft); }
.toc a[aria-current="page"] { background: var(--indigo); color: var(--on-indigo); font-weight: 600; }
.toc a[aria-current="page"] .n { color: inherit; opacity: .75; }
.results { margin: 0 0 8px; }
.results a { display: block; }
.results small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.results mark { background: var(--ochre-soft); color: inherit; border-radius: 3px; }
.toc .empty { padding: 8px; color: var(--muted); font-size: 14px; }

/* Lecture */
main { min-width: 0; padding: 32px 16px 80px; }
.page { max-width: 820px; margin-inline: auto; }
.crumb { font-size: 13px; color: var(--ochre-deep); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.doc h1 { font-size: clamp(28px, 4.6vw, 40px); line-height: 1.15; font-weight: 700; color: var(--ink); margin: 0 0 18px; text-wrap: balance; }
.doc h2 { font-size: 24px; line-height: 1.25; font-weight: 600; color: var(--ink); margin: 44px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: calc(var(--bar) + 16px); }
.doc h3 { font-size: 18px; font-weight: 600; color: var(--ink); margin: 28px 0 8px; scroll-margin-top: calc(var(--bar) + 16px); }
.doc p, .doc li { max-width: 68ch; }
.doc p { margin: 0 0 14px; }
.doc ul, .doc ol { padding-left: 22px; margin: 0 0 16px; }
.doc li { margin-bottom: 6px; }
.doc li::marker { color: var(--ochre-deep); }
.doc strong { color: var(--ink); font-weight: 600; }
.doc a { color: var(--indigo); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.doc code { font-size: .9em; background: var(--indigo-soft); color: var(--ink); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.doc blockquote { margin: 0 0 16px; padding: 12px 16px; border-radius: 12px; background: var(--ochre-soft); color: var(--text); }
.doc blockquote p:last-child { margin: 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }

/* Captures : ordinateur et téléphone côte à côte */
.captures { display: flex; gap: 14px; align-items: flex-start; margin: 18px 0 22px; }
.captures img {
  display: block; height: auto; border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--paper); cursor: zoom-in;
}
.captures img[src*="/bureau/"] { flex: 2.15 1 0; min-width: 0; }
.captures img[src*="/mobile/"] { flex: 1 1 0; min-width: 0; border-radius: 18px; }
.captures img[src*="/bureau/"]:only-child { flex-basis: 100%; }

/* Tableaux de texte */
.tableau { overflow-x: auto; margin: 16px 0 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.tableau table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tableau th { text-align: left; font-weight: 600; color: var(--ink); background: var(--indigo-soft); }
.tableau th, .tableau td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tableau tr:last-child td { border-bottom: 0; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager a {
  display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
  color: var(--ink); text-decoration: none; min-width: 0;
}
.pager a:hover { border-color: var(--indigo); }
.pager small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
.pager span { display: block; font-weight: 600; line-height: 1.3; margin-top: 2px; }
.pager .next { text-align: right; grid-column: 2; }
.colophon { margin-top: 28px; font-size: 13px; color: var(--muted); }
.loading { color: var(--muted); padding: 40px 0; }

/* Agrandir une capture */
.zoom { position: fixed; inset: 0; z-index: 50; background: rgb(12 13 30 / .9); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; }

.scrim { display: none; }

@media (max-width: 900px) {
  .btn-toc { display: inline-flex; }
  .layout { display: block; }
  .toc {
    position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(88vw, 340px); height: auto;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--ground); border-right: 1px solid var(--line);
    transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow);
  }
  body.toc-open .toc { transform: none; }
  body.toc-open .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgb(12 13 30 / .5); }
  main { padding-top: 22px; }
  .captures { flex-direction: column; align-items: stretch; }
  .captures img[src*="/bureau/"] { flex: none; width: 100%; }
  .captures img[src*="/mobile/"] { flex: none; width: 62%; align-self: center; }
  .doc h2 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { .toc { transition: none; } }
</style>

<header class="bar">
  <button class="btn-toc" id="btn-toc" type="button" aria-controls="toc" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    Sommaire
  </button>
  <a class="logo" href="#c-accueil">
    <span class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="2.6" fill="#2C2F6B"/><circle cx="16" cy="8" r="2.6" fill="#B5532F"/><path d="M4 11c0 5 3.6 8 8 8s8-3 8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    </span>
    <span class="name">Waumini <span>· Manuel</span></span>
  </a>
  <span class="spacer"></span>
</header>

<div class="layout">
  <nav class="toc" id="toc" aria-label="Sommaire du manuel">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher : reçu, budget, QR code…" aria-label="Chercher dans le manuel" autocomplete="off">
    </div>
    <div class="results" id="results" hidden></div>
    <div id="chapters"><p class="empty">Chargement du sommaire…</p></div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="page">
      <p class="crumb" id="crumb"></p>
      <article class="doc" id="doc"><p class="loading">Chargement…</p></article>
      <nav class="pager" id="pager" aria-label="Chapitre précédent et suivant"></nav>
      <p class="colophon" id="colophon"></p>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const doc = $('doc'), pager = $('pager'), crumb = $('crumb');
  let order = [], bySlug = {}, current = null;
  const cache = {};

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); return v; } catch { return null; } };

  async function fragment(slug) {
    if (!cache[slug]) cache[slug] = fetch(`chapitres/${slug}.html`).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); });
    return cache[slug];
  }

  function parse(hash) {
    const m = /^#c-([a-z0-9-]+?)(?:--(.+))?$/.exec(decodeURIComponent(hash || ''));
    return m && (m[1] === 'accueil' || bySlug[m[1]]) ? { slug: m[1], anchor: m[2] || null } : null;
  }

  async function show(slug, anchor, push) {
    closeToc();
    if (slug !== current) {
      doc.innerHTML = '<p class="loading">Chargement…</p>';
      try { doc.innerHTML = await fragment(slug); }
      catch { doc.innerHTML = '<p>Ce chapitre ne s’est pas chargé. Vérifiez la connexion, puis touchez de nouveau le chapitre dans le sommaire.</p>'; return; }
      current = slug;
      store('waumini-manuel', slug);
      const info = bySlug[slug];
      crumb.textContent = info ? (info.num !== null ? `Chapitre ${info.num} · ${info.group}` : info.group) : 'Manuel d’utilisation';
      document.title = info ? `${info.title} · Manuel de Waumini` : 'Manuel de Waumini';
      document.querySelectorAll('#chapters a').forEach((a) => a.dataset.slug === slug ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
      renderPager(slug);
    }
    if (push) { try { history.replaceState(null, '', `#c-${slug}`); } catch {} }
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  function renderPager(slug) {
    const i = order.indexOf(slug);
    const prev = slug === 'accueil' ? null : (i > 0 ? order[i - 1] : 'accueil');
    const next = slug === 'accueil' ? order[0] : order[i + 1];
    const link = (s, cls, label) => s ? `<a class="${cls}" href="#c-${s}"><small>${label}</small><span>${esc(s === 'accueil' ? 'Accueil du manuel' : bySlug[s].title)}</span></a>` : '';
    pager.innerHTML = link(prev, 'prev', 'Précédent') + link(next, 'next', 'Suivant');
  }

  // Liens du manuel : chapitres (#c-slug) et sections (#c-slug--ancre).
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#c-"]');
    if (a) {
      const t = parse(a.getAttribute('href'));
      if (t) { e.preventDefault(); show(t.slug, t.anchor, true); }
      return;
    }
    const img = e.target.closest('.captures img');
    if (img) {
      const z = document.createElement('div');
      z.className = 'zoom'; z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', img.alt || 'Capture');
      z.innerHTML = `<img src="${img.getAttribute('src')}" alt="${esc(img.alt || '')}">`;
      z.addEventListener('click', () => z.remove());
      document.body.appendChild(z);
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.querySelector('.zoom')?.remove(); closeToc(); } });

  // Sommaire en tiroir sur téléphone
  const btn = $('btn-toc');
  function closeToc() { document.body.classList.remove('toc-open'); btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', () => { const open = document.body.classList.toggle('toc-open'); btn.setAttribute('aria-expanded', String(open)); });
  $('scrim').addEventListener('click', closeToc);

  // Recherche dans tout le texte du manuel
  const q = $('q'), results = $('results'), chaptersBox = $('chapters');
  const texts = {};
  async function loadTexts() {
    await Promise.all(order.map(async (s) => {
      if (texts[s]) return;
      const div = document.createElement('div');
      try { div.innerHTML = await fragment(s); } catch { return; }
      texts[s] = div.textContent.replace(/\s+/g, ' ');
    }));
  }
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let timer;
  q.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const term = q.value.trim();
      if (term.length < 2) { results.hidden = true; chaptersBox.hidden = false; return; }
      results.hidden = false; chaptersBox.hidden = true;
      results.innerHTML = '<p class="empty">Recherche…</p>';
      await loadTexts();
      const t = norm(term);
      const hits = order.filter((s) => texts[s] && norm(bySlug[s].title + ' ' + texts[s]).includes(t)).slice(0, 25);
      results.innerHTML = hits.length ? hits.map((s) => {
        const text = texts[s], i = norm(text).indexOf(t);
        const snippet = i < 0 ? '' : '…' + esc(text.slice(Math.max(0, i - 50), i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length, i + term.length + 60)) + '…';
        return `<a href="#c-${s}" data-slug="${s}"><span>${esc(bySlug[s].title)}</span>${snippet ? `<small>${snippet}</small>` : ''}</a>`;
      }).join('') : `<p class="empty">Rien trouvé pour « ${esc(term)} ». Essayez un autre mot.</p>`;
    }, 200);
  });

  fetch('sommaire.json').then((r) => r.json()).then((data) => {
    chaptersBox.innerHTML = data.groups.map((g) => `<h2>${esc(g.title)}</h2><ol>${g.chapters.map((c) => {
      bySlug[c.slug] = { ...c, group: g.title }; order.push(c.slug);
      return `<li><a href="#c-${c.slug}" data-slug="${c.slug}"><span class="n">${c.num ?? '·'}</span><span>${esc(c.title)}</span></a></li>`;
    }).join('')}</ol>`).join('');
    $('colophon').textContent = `Manuel d’utilisation de Waumini · Genius ICT, Goma · édition du ${data.date}. Les noms, numéros et montants des captures sont ceux de la communauté de démonstration ; ils sont fictifs.`;
    const start = parse(location.hash) || { slug: store('waumini-manuel') && bySlug[store('waumini-manuel')] ? store('waumini-manuel') : 'accueil', anchor: null };
    show(start.slug, start.anchor, false);
  }).catch(() => { chaptersBox.innerHTML = '<p class="empty">Le sommaire ne s’est pas chargé. Rechargez la page.</p>'; });
})();
</script>
