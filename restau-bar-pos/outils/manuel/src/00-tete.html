<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuel restau-bar-pos</title>
<meta name="description" content="Manuel d'utilisation de restau-bar-pos : la caisse, la gestion et la plateforme, avec des captures sur ordinateur et sur téléphone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Sora:wght@400;600;700&display=swap">
<style>
/* Manuel : sommaire collant à gauche sur grand écran, une colonne de lecture, captures ordinateur + téléphone côte à côte.
   Couleurs et polices du système de design Volcan, thème jour ou nuit. Feuille d'impression A4 en fin de fichier. */
:root {
  --fond: #F4F3F1; --surface: #FFFFFF; --encre: #111315; --doux: #5B6168; --ligne: #DEDCD8;
  --lave: #E04A12; --lave-texte: #B23A0C; --braise: #9A5B00; --glace: #1F7F93; --nuit: #111315; --succes: #1E7A46;
  --titre: "Unbounded", "Arial Black", system-ui, sans-serif;
  --texte: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #111315; --surface: #1C1F23; --encre: #F2EFEA; --doux: #A3A9AF; --ligne: #2C3035;
    --lave: #FF5A1F; --lave-texte: #FF7A45; --braise: #FFB547; --glace: #6CC3D5; --succes: #5CC98A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #111315; --surface: #1C1F23; --encre: #F2EFEA; --doux: #A3A9AF; --ligne: #2C3035;
  --lave: #FF5A1F; --lave-texte: #FF7A45; --braise: #FFB547; --glace: #6CC3D5; --succes: #5CC98A; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  background: var(--fond); color: var(--encre); font: 16px/1.6 var(--texte);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px; margin: 0;
}
a { color: var(--lave-texte); }
:focus-visible { outline: 3px solid var(--lave); outline-offset: 2px; }
.cadre { max-width: 1220px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 44px; }
@media (max-width: 900px) { .cadre { grid-template-columns: minmax(0, 1fr); gap: 0; } .sommaire { display: none; } }

.couverture { padding-block: 48px 32px; border-bottom: 1px solid var(--ligne); margin-bottom: 8px; }
.couverture__sur { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--doux); }
.couverture h1 { margin: 8px 0 12px; font: 800 clamp(40px, 9vw, 76px)/.95 var(--titre); color: var(--lave-texte); text-wrap: balance; }
.couverture__chapeau { margin: 0; max-width: 62ch; font-size: 18px; color: var(--doux); }
.publics { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 24px; }
.publics a { display: block; text-decoration: none; color: var(--encre); background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 14px 16px; }
.publics a:hover { border-color: var(--lave); }
.publics strong { display: block; font: 600 15px/1.2 var(--titre); color: var(--lave-texte); margin-bottom: 4px; }
.publics span { font-size: 14px; color: var(--doux); }
.couverture__image { display: none; }

.sommaire { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; padding: 40px 4px 24px 0; font-size: 13.5px; }
.sommaire p { margin: 18px 0 6px; font: 600 11px var(--titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.sommaire p:first-child { margin-top: 0; }
.sommaire ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; }
.sommaire a { color: var(--encre); text-decoration: none; display: block; padding: 2px 0; }
.sommaire a:hover { color: var(--lave-texte); }
.sommaire .n { display: inline-block; min-width: 1.9em; color: var(--doux); font-variant-numeric: tabular-nums; }
.sommaire-impression { display: none; }

main { min-width: 0; }
.partie { margin: 56px 0 0; padding: 28px 24px; border-radius: 14px; background: var(--nuit); color: #F2EFEA; }
.partie__sur { margin: 0; font: 600 12px var(--titre); letter-spacing: .12em; text-transform: uppercase; color: #FFB547; }
.partie h2 { margin: 6px 0 8px; font: 800 clamp(26px, 5vw, 38px)/1.05 var(--titre); color: #F2EFEA; }
.partie p { margin: 0; color: #C9CDD1; max-width: 70ch; }
section.chapitre { padding-top: 40px; }
section.chapitre > h2 { font: 800 28px/1.12 var(--titre); margin: 0 0 6px; text-wrap: balance; }
h2 .num { color: var(--lave-texte); margin-right: 10px; }
h3 { font: 600 19px/1.25 var(--titre); margin: 30px 0 8px; text-wrap: balance; }
h4 { font: 700 16px/1.3 var(--texte); margin: 20px 0 4px; }
p, li, dd { max-width: 74ch; }
.intro { color: var(--doux); font-size: 17px; margin-top: 0; }
.qui { display: inline-block; font: 600 11px/1 var(--titre); letter-spacing: .06em; text-transform: uppercase; color: var(--glace); border: 1px solid currentColor; border-radius: 999px; padding: 5px 9px; margin: 0 0 8px; }
ol.etapes { padding-left: 24px; }
ol.etapes li { margin: 6px 0; padding-left: 2px; }
.chemin { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
.bouton { display: inline-block; font-weight: 700; font-size: .9em; line-height: 1.5; padding: 0 8px; border-radius: 6px; background: var(--lave); color: #111315; white-space: nowrap; }
.libelle { font-weight: 700; }

.captures { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 16px; align-items: start; margin: 16px 0 10px; }
.captures--seule { grid-template-columns: minmax(0, 1fr); }
.captures--moitie { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
.captures--deux { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.captures--trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.captures--tels { grid-template-columns: repeat(auto-fit, minmax(150px, 220px)); }
.captures--fenetres { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
@media (max-width: 640px) {
  .captures, .captures--deux, .captures--trois { grid-template-columns: minmax(0, 1fr); }
  .captures--tels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
figure { margin: 0; min-width: 0; }
figure img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--ligne); background: var(--surface); max-width: 100%; }
figure.etroite img { max-width: 360px; }
figcaption { font-size: 13px; color: var(--doux); margin-top: 6px; }
.etiquette { font: 600 11px var(--titre); letter-spacing: .08em; text-transform: uppercase; color: var(--glace); margin-right: 6px; }

.note { border-left: 4px solid var(--glace); background: var(--surface); padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 16px 0; max-width: 74ch; }
.note--attention { border-left-color: var(--lave); }
.note--astuce { border-left-color: var(--succes); }
.note p { margin: 0; }
.note p + p, .note p + ul, .note ul + p { margin-top: 6px; }
.note ul { margin: 4px 0 0; padding-left: 20px; }
.note strong:first-child { display: block; margin-bottom: 2px; }

table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tableau { overflow-x: auto; margin: 12px 0; max-width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--ligne); vertical-align: top; }
th { font-size: 12.5px; color: var(--doux); font-weight: 600; }
td:first-child { font-weight: 600; }
.tableau--cle td:first-child { width: 28%; }
dl.faq dt, dl.glossaire dt { font-weight: 700; margin-top: 14px; }
dl.faq dd, dl.glossaire dd { margin: 3px 0 0; }
pre { background: var(--nuit); color: #F2EFEA; padding: 12px 14px; border-radius: 10px; overflow-x: auto; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
footer.fin { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--ligne); font-size: 13px; color: var(--doux); }

/* ---------- Impression A4 (et PDF) ---------- */
@page { size: A4; margin: 16mm 14mm 17mm; }
@media print {
  :root { --fond: #FFFFFF; --surface: #F7F6F4; --encre: #111315; --doux: #4A5057; --ligne: #D6D3CE; --lave-texte: #B23A0C; --glace: #1F7F93; }
  html, body { background: #fff; color: #111315; }
  body { padding: 0; font-size: 10pt; line-height: 1.45; }
  .sommaire { display: none; }
  .cadre { display: block; max-width: none; }
  .couverture { break-after: page; min-height: 255mm; display: flex; flex-direction: column; justify-content: center; border: 0; padding: 0; margin: 0; }
  .couverture h1 { font-size: 58pt; }
  .couverture__chapeau { font-size: 13pt; }
  .couverture__image { display: block; margin-top: 14mm; }
  .couverture__image img { width: 100%; max-height: 95mm; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid #D6D3CE; }
  .publics a { border-color: #D6D3CE; }
  .sommaire-impression { display: block; break-after: page; }
  .sommaire-impression h2 { font: 800 20pt var(--titre); margin: 0 0 4mm; }
  .sommaire-impression p { margin: 3.2mm 0 1mm; font: 600 8.5pt var(--titre); letter-spacing: .1em; text-transform: uppercase; color: #B23A0C; break-after: avoid; }
  .sommaire-impression ol { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 9mm; }
  .sommaire-impression li { display: flex; gap: 2mm; font-size: 9pt; line-height: 1.5; break-inside: avoid; }
  .sommaire-impression li a { color: #111315; text-decoration: none; display: flex; flex: 1; gap: 2mm; }
  .sommaire-impression .n { min-width: 6mm; color: #4A5057; }
  .sommaire-impression .points { flex: 1; border-bottom: 1px dotted #9AA0A6; margin-bottom: 1.2mm; }
  .sommaire-impression .page { min-width: 6mm; text-align: right; font-variant-numeric: tabular-nums; }
  .partie { break-before: page; background: #111315 !important; color: #F2EFEA; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin: 0 0 6mm; padding: 9mm 8mm; }
  .partie + section.chapitre { break-before: avoid; }
  section.chapitre { break-before: page; padding-top: 0; }
  section.chapitre > h2 { font-size: 18pt; }
  h3 { font-size: 12.5pt; margin: 6mm 0 2mm; }
  h4 { font-size: 10.5pt; }
  h2, h3, h4 { break-after: avoid; }
  p, li { orphans: 2; widows: 2; }
  .intro { font-size: 11pt; }
  figure, .note, tr, pre, dl.faq div, dl.glossaire div { break-inside: avoid; }
  .captures { gap: 4mm; margin: 3mm 0; break-inside: avoid; }
  figure img { max-height: 150mm; width: auto; max-width: 100%; object-fit: contain; border-radius: 4px; }
  .captures--tels figure img, .captures > figure:nth-child(2):last-child img { max-height: 120mm; }
  figure.etroite img { max-width: 85mm; }
  figcaption { font-size: 8pt; margin-top: 1.5mm; }
  .tableau { overflow: visible; }
  table { font-size: 8.8pt; }
  pre { font-size: 8.5pt; background: #111315 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bouton { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: #B23A0C; text-decoration: none; }
  .doc-externe::after { content: " (" attr(data-fichier) ")"; font-size: .85em; color: #4A5057; }
  footer.fin { break-inside: avoid; }
  .ecran-seulement { display: none; }
}
</style>
</head>
<body>
